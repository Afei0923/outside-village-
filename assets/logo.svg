<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5cb3f0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3a7fd5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a6b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background shape - tilted parallelogram -->
  <polygon points="55,25 170,25 145,145 30,145" fill="url(#grad1)" />
  <!-- Z/N letter cutout effect using white shapes -->
  <!-- Top horizontal bar of Z -->
  <polygon points="70,45 150,45 145,60 65,60" fill="rgba(255,255,255,0.95)" />
  <!-- Diagonal of Z connecting to N -->
  <polygon points="135,45 150,45 80,130 65,130" fill="rgba(255,255,255,0.95)" />
  <!-- Bottom part forming N right leg -->
  <polygon points="125,115 140,115 135,130 120,130" fill="rgba(255,255,255,0.95)" />
  <!-- N left vertical -->
  <polygon points="65,60 80,60 75,130 60,130" fill="rgba(255,255,255,0.95)" />
  <!-- N right vertical -->
  <polygon points="130,60 145,60 140,130 125,130" fill="rgba(255,255,255,0.95)" />
  <!-- Chinese text -->
  <text x="100" y="172" text-anchor="middle" fill="#1a1a1a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold">知宁技术</text>
  <!-- English text -->
  <text x="100" y="192" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="12" letter-spacing="3">—  ZHINING  —</text>
</svg>
